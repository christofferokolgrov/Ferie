name: Ferie sweep

# One sweep per day, at 12:00 Norwegian time. GitHub crons are UTC and have no
# DST handling, so 10:00 UTC = 12:00 CEST (summer) / 11:00 CET (winter).
# GitHub's `schedule` is also best-effort — a daily cron is usually punctual to
# within minutes, but can be delayed or dropped under load, so the schedule is
# kept as a FALLBACK. For an exact 12:00 every day, point an external scheduler
# (e.g. cron-job.org) at the workflow_dispatch API once a day — see README
# "Reliable scheduling". repository_dispatch works too.
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [sweep]

# Don't pile up overlapping sweeps if one runs long. Also the write lock for
# data/: the store commits back to this branch, so two sweeps must never run at
# once.
concurrency:
  group: ferie-sweep
  cancel-in-progress: false

# The sweep commits data/deals.json + data/seen.json back to the repo.
permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"

      # Chromium is a ~150 MB download per run; cache it keyed on the
      # Playwright version so most runs skip the download entirely.
      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.pw.outputs.version }}

      - name: Install Chromium for Playwright
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # System libs live outside the cached path; install them on cache hits.
      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run sweep (all sources)
        run: node src/run.mjs
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      # data/ is the store. Commit it so the next run remembers what we've
      # already emailed about, and so the dashboard can read it. `git pull
      # --rebase` guards against the branch having moved while the sweep ran.
      - name: Commit updated deal data
        run: |
          if git diff --quiet -- data/; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "data: sweep $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
